name: Deployment

on:
  push:
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    branches-ignore:
      - release-please-**

# One group per branch/PR: PR runs never queue behind (or replace) a main run.
# Only superseded PR runs are cancelled; a main run may be publishing a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web' && github.ref_name == 'main' }}
    permissions:
      contents: write  # release commit, tag and GitHub release
      pull-requests: write  # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Library is built and deployed to NPM
  # ------------------------------------

  build-deploy-library-package:
    name: build-deploy-library-package
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web' && needs.release-please.outputs.release_created == 'true' }}
    environment: npm  # required by the npm trusted publisher; main only
    permissions:
      contents: read
      packages: write  # publish the npm package via the trusted publisher
      id-token: write  # npm trusted publishing
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 'lts/*'
        registry-url: 'https://registry.npmjs.org'

    # npm stage needs npm >= 11.15.0
    - name: Update npm
      # zizmor: ignore[adhoc-packages] required until the npm version in the runner image ships npm stage
      run: npm install -g npm@^11.15.0

    - name: Install dependencies
      run: npm ci

    # A maintainer approves the staged version (npm 2FA) before it goes live.
    # Run in the package dir: npm stage does not handle --workspace reliably.
    - name: Stage the release on npm
      working-directory: packages/diracx-web-components
      run: npm stage publish --tag latest

  # Storybook is built and deployed to GitHub Pages
  # -----------------------------------------------

  build-storybook-docs:
    name: build-storybook-docs
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC authentication for the Pages deployment
      pages: write  # deploy the storybook to GitHub Pages
    if: ${{  github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          
      - name: Build documentation
        run: npm ci && npm --prefix packages/diracx-web-components run build-doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with: 
          path: packages/diracx-web-components/storybook-static

  deploy-storybook-docs:
    name: deploy-storybook-docs
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC authentication for the Pages deployment
      pages: write  # deploy the storybook to GitHub Pages
    needs: [build-storybook-docs, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    steps:    
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          token: ${{ github.token }}

  # diracx-web is built and deployed to GitHub Container Registry
  # -------------------------------------------------------------

  build-deploy-diracx-web-dev-image:
    name: build-deploy-diracx-web-dev-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web' }}
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx-web/static:dev
          platforms: linux/amd64,linux/arm64

  build-deploy-diracx-web-release-image:
    name: build-deploy-diracx-web-release-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web' }}
    needs: release-please
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/diracgrid/diracx-web/static:${{ needs.release-please.outputs.tag_name }}
          platforms: linux/amd64,linux/arm64

  # Helm charts are updated in diracx-charts
  # -----------------------------------------

  update-charts:
    name: Update Helm charts
    needs:
      - release-please
      - build-deploy-diracx-web-release-image
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout diracx-web (for update script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diracx-web
          sparse-checkout: .github/workflows
          persist-credentials: false

      - name: Checkout diracx-charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PAT is required to push the chart bump to diracx-charts master,
          # and its persisted credentials are used for the push.
          # zizmor: ignore[secrets-outside-env,artipacked] PAT required to push to the diracx-charts master branch
          repository: DIRACGrid/diracx-charts
          token: ${{ secrets.CHARTS_UPDATE_TOKEN }}
          path: diracx-charts

      - name: Configure Git
        run: |
          cd diracx-charts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update chart versions
        env:
          WEB_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python diracx-web/.github/workflows/update_chart_version.py \
            --charts-dir diracx-charts \
            --web-version "${WEB_VERSION}"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit to update README
        run: |
          cd diracx-charts
          pre-commit run --all-files || true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3

      - name: Commit and push changes
        if: success()
        run: |
          cd diracx-charts

          # Update the diagram to reflect the updated version number
          pixi run generate-diagram

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump diracx-web to ${WEB_VERSION}"
            git push origin master
          else
            echo "No changes to commit"
          fi

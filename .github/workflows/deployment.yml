name: Deployment

on:
  push:
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    branches-ignore:
      - release-please-**
  # A release manager publishes the draft release made by release-please. That
  # creates the tag and starts the npm, storybook and release image jobs.
  release:
    types: [published]

# One group per branch/PR: PR runs never queue behind (or replace) a main run.
# Only superseded PR runs are cancelled; a main run may be publishing a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Also runs when the draft is published, to open the next release PR.
    if: >-
      github.repository == 'DIRACGrid/diracx-web'
      && ((github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'release')
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write  # release commit and draft GitHub release
      pull-requests: write  # open and update the release PR
    steps:
      # release-please ignores draft releases (they have no tag). Until the draft
      # is published it would build the next release PR from the whole history.
      - name: Check for an unpublished draft release
        id: pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Always the default branch: a release or re-run SHA can be an older commit.
          MANIFEST_REF: ${{ github.event.repository.default_branch }}
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$MANIFEST_REF" \
            --jq .content | base64 -d | jq -er '."."')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Unexpected version in .release-please-manifest.json: '$version'"
            exit 1
          fi
          drafts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v$version\") | .id")"
          if [[ -n "$drafts" ]]; then
            echo "::warning::Draft release v$version is not published yet: release-please skipped"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      # Two calls: within one call the PR step cannot see the draft the release
      # step just made.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.pending.outputs.draft != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.pending.outputs.draft != 'true' && steps.release.outputs.releases_created != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Library is built and deployed to NPM
  # ------------------------------------

  build-deploy-library-package:
    name: build-deploy-library-package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.repository == 'DIRACGrid/diracx-web' }}
    environment: npm  # required by the npm trusted publisher; main and v* tags only
    permissions:
      contents: read
      packages: write  # publish the npm package via the trusted publisher
      id-token: write  # npm trusted publishing
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 'lts/*'
        registry-url: 'https://registry.npmjs.org'
        # No cache in a job that publishes: a pull request could have filled it.
        package-manager-cache: false

    # npm stage needs npm >= 11.15.0
    - name: Update npm
      # zizmor: ignore[adhoc-packages] required until the npm version in the runner image ships npm stage
      run: npm install -g npm@^11.15.0

    - name: Install dependencies
      run: npm ci

    # A maintainer approves the staged version (npm 2FA) before it goes live.
    # Run in the package dir: npm stage does not handle --workspace reliably.
    - name: Stage the release on npm
      working-directory: packages/diracx-web-components
      run: npm stage publish --tag latest

  # Storybook is built and deployed to GitHub Pages
  # -----------------------------------------------

  build-storybook-docs:
    name: build-storybook-docs
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC authentication for the Pages deployment
      pages: write  # deploy the storybook to GitHub Pages
    if: ${{  github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'
          # No cache: the result is deployed to Pages on a release.
          package-manager-cache: false
          
      - name: Build documentation
        run: npm ci && npm --prefix packages/diracx-web-components run build-doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: 
          path: packages/diracx-web-components/storybook-static

  deploy-storybook-docs:
    name: deploy-storybook-docs
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC authentication for the Pages deployment
      pages: write  # deploy the storybook to GitHub Pages
    needs: build-storybook-docs
    if: github.event_name == 'release'
    steps:    
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          token: ${{ github.token }}

  # diracx-web is built and deployed to GitHub Container Registry
  # -------------------------------------------------------------

  build-deploy-diracx-web-dev-image:
    name: build-deploy-diracx-web-dev-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web') }}
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.repository == 'DIRACGrid/diracx-web' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx-web/static:dev
          platforms: linux/amd64,linux/arm64

  build-deploy-diracx-web-release-image:
    name: build-deploy-diracx-web-release-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.repository == 'DIRACGrid/diracx-web' }}
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/diracgrid/diracx-web/static:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64

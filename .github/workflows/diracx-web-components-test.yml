name: DiracX-Web Components Tests

on:
  push:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - release-please-**

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
              
      - name: Trigger unit tests
        run: npm --prefix packages/diracx-web-components run test

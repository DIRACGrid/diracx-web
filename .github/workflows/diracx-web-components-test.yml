name: DiracX-Web Components Tests

on:
  push:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - release-please-**

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
              
      - name: Trigger unit tests
        run: npm --prefix packages/diracx-web-components run test

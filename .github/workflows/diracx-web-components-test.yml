name: DiracX-Web Components Tests

on:
  push:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    paths:
      - 'packages/diracx-web-components/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - release-please-**

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
              
      - name: Trigger unit tests
        run: npm --prefix packages/diracx-web-components run test

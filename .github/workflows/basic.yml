name: Basic checks

on:
  push:
    branches-ignore:
      - renovate/**
      - release-please-**
  pull_request:
    branches-ignore:
      - release-please-**

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diracx-web'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # Build the library: needed to successfully run the following checks
      - name: Build Library
        run: npm run build:diracx-web-components
              
      - name: Check formatting rules
        run: npx prettier . --check
      - name: Check code-quality rules
        run: npm run lint
      - name: Check typescript type validity
        run: npm run ts-lint

      # Individual PR commits are NOT linted: PRs are squash-merged and the
      # PR title becomes the commit message, so the title is what must follow
      # the conventional-commit format (enforced by pr-title.yml). This
      # push-time check remains as a backstop for the squashed commits landing
      # on main and for direct pushes.
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
